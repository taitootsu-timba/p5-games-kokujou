<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>p5.js ゲーム作品</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-okaidia.min.css" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #121212;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
    }
    h1 {
      font-size: 1.2rem;
      margin-bottom: 5px;
    }
    p {
      color: #aaa;
      margin-bottom: 20px;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #4fc3f7;
      text-decoration: none;
    }
    .back-link:hover {
      text-decoration: underline;
    }
    #game-container {
      display: flex;
      justify-content: center;
      margin-bottom: 40px;
    }
    #game-container canvas {
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      border-radius: 4px;
    }
    .code-container {
      max-width: 800px;
      margin: 0 auto 40px auto;
      text-align: left;
      background: #272822;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .code-header {
      background: #1e1e1e;
      margin: 0;
      padding: 8px 15px;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .code-header span {
      font-size: 0.85rem;
      color: #888;
      font-weight: bold;
    }
    .copy-btn {
      background: transparent;
      border: 1px solid #444;
      color: #ccc;
      padding: 5px 8px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, border-color 0.2s;
    }
    .copy-btn:hover {
      background: #333;
      border-color: #666;
      color: #fff;
    }
    .copy-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }
    pre {
      margin: 0 !important;
      padding: 15px !important;
      font-size: 0.85rem;
      max-height: 500px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <a href="index.html" class="back-link">← 一覧に戻る</a>
  <h1>作者: 斉藤</h1>
  <p>マリオみたいなやつ</p>
  
  <!-- ゲーム画面を配置する領域 -->
  <div id="game-container"></div>

  <!-- ソースコード表示領域（ゲーム画面の下） -->
  <div class="code-container">
    <div class="code-header">
      <span>ソースコード</span>
      <button class="copy-btn" id="copy-btn" title="コードをコピー" aria-label="コードをコピー">
        <svg id="copy-icon" viewBox="0 0 24 24">
          <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
        </svg>
      </button>
    </div>
    <pre><code id="source-code" class="language-javascript">https://editor.p5js.org/?version=2.3.3</code></pre>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-clike.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>

  <script>
    // コピー機能の実装
    const copyBtn = document.getElementById("copy-btn");
    const copyIcon = document.getElementById("copy-icon");
    const originalSvg = '<path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>';
    const checkSvg = '<path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>';

    copyBtn.addEventListener("click", function() {
      const codeText = document.getElementById("source-code").textContent;
      navigator.clipboard.writeText(codeText).then(function() {
        copyIcon.innerHTML = checkSvg;
        copyBtn.style.color = "#4fc3f7";
        setTimeout(function() {
          copyIcon.innerHTML = originalSvg;
          copyBtn.style.color = "";
        }, 2000);
      });
    });

    // 生成されたキャンバスを #game-container の中に格納する
    function ensureCanvasInContainer() {
      const container = document.getElementById("game-container");
      const canvas = document.querySelector("canvas");
      if (canvas && canvas.parentElement !== container) {
        container.appendChild(canvas);
      }
    }
    const canvasObserver = new MutationObserver(function() {
      ensureCanvasInContainer();
    });
    canvasObserver.observe(document.body, { childList: true, subtree: true });
    window.addEventListener("load", ensureCanvasInContainer);
  </script>

  <!-- 生徒のゲームスクリプト -->
  <script>https://editor.p5js.org/?version=2.3.3</script>
</body>
</html>
