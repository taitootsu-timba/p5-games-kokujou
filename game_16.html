<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>p5.js ゲーム作品</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-okaidia.min.css" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #121212;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
    }
    .header-group {
      margin-bottom: 20px;
    }
    h1 {
      font-size: 1.2rem;
      margin: 10px 0 5px 0;
    }
    p {
      color: #aaa;
      margin: 0;
    }
    .back-link {
      display: inline-block;
      color: #4fc3f7;
      text-decoration: none;
      font-size: 0.95rem;
    }
    .back-link:hover {
      text-decoration: underline;
    }
    /* ゲーム画面エリア（中央寄せ） */
    #game-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      margin: 10px auto 40px auto;
      min-height: 100px;
    }
    #game-container canvas {
      display: block !important;
      margin: 0 auto !important;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      border-radius: 4px;
    }
    /* ソースコード枠（ゲーム画面の下） */
    .code-container {
      width: 100%;
      max-width: 800px;
      margin: 0 auto 40px auto;
      text-align: left;
      background: #272822;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .code-header {
      background: #1e1e1e;
      margin: 0;
      padding: 8px 15px;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .code-header span {
      font-size: 0.85rem;
      color: #888;
      font-weight: bold;
    }
    .copy-btn {
      background: transparent;
      border: 1px solid #444;
      color: #ccc;
      padding: 5px 8px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, border-color 0.2s;
    }
    .copy-btn:hover {
      background: #333;
      border-color: #666;
      color: #fff;
    }
    .copy-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }
    pre {
      margin: 0 !important;
      padding: 15px !important;
      font-size: 0.85rem;
      max-height: 500px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <!-- 1. ヘッダー情報 -->
  <div class="header-group">
    <a href="index.html" class="back-link">← 一覧に戻る</a>
    <h1>作者: 斉藤</h1>
    <p>マリオみたいなやつ</p>
  </div>

  <!-- 2. ゲーム画面コンテナ（必ずコード枠の上） -->
  <div id="game-container"></div>

  <!-- 3. ソースコード枠（必ずゲーム画面の下） -->
  <div class="code-container">
    <div class="code-header">
      <span>ソースコード</span>
      <button class="copy-btn" id="copy-btn" title="コードをコピー" aria-label="コードをコピー">
        <svg id="copy-icon" viewBox="0 0 24 24">
          <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
        </svg>
      </button>
    </div>
    <pre><code id="source-code" class="language-javascript">https://editor.p5js.org/?version=2.3.3</code></pre>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-clike.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>

  <script>
    // コピーボタン処理
    const copyBtn = document.getElementById("copy-btn");
    const copyIcon = document.getElementById("copy-icon");
    const originalSvg = '<path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>';
    const checkSvg = '<path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>';

    copyBtn.addEventListener("click", function() {
      const codeText = document.getElementById("source-code").textContent;
      navigator.clipboard.writeText(codeText).then(function() {
        copyIcon.innerHTML = checkSvg;
        copyBtn.style.color = "#4fc3f7";
        setTimeout(function() {
          copyIcon.innerHTML = originalSvg;
          copyBtn.style.color = "";
        }, 2000);
      });
    });

    // キャンバス生成位置を #game-container の中に強制移動する
    function relocateCanvas() {
      const container = document.getElementById("game-container");
      const canvases = document.querySelectorAll("canvas");
      canvases.forEach(cvs => {
        if (cvs.parentElement !== container) {
          container.appendChild(cvs);
        }
      });
    }

    const observer = new MutationObserver(relocateCanvas);
    observer.observe(document.body, { childList: true, subtree: true });
    window.addEventListener("DOMContentLoaded", relocateCanvas);
    window.addEventListener("load", relocateCanvas);
  </script>

  <!-- 4. 生徒のスクリプト実行 -->
  <script>
    window.addEventListener('load', () => {
      if (typeof window.setup === 'function') {
        const originalSetup = window.setup;
        window.setup = function() {
          originalSetup.apply(this, arguments);
          relocateCanvas();
        };
      }
    });
  </script>
  <script>https://editor.p5js.org/?version=2.3.3</script>
</body>
</html>
