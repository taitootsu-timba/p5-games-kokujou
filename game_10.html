<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>p5.js ゲーム作品</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-okaidia.min.css" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 20px; background: #121212; color: #fff; font-family: sans-serif; text-align: center; }
    h1 { font-size: 1.2rem; margin-bottom: 5px; }
    p { color: #aaa; margin-bottom: 20px; }
    canvas { box-shadow: 0 4px 10px rgba(0,0,0,0.5); border-radius: 4px; margin-bottom: 30px; }
    .back-link { display: inline-block; margin-bottom: 20px; color: #4fc3f7; text-decoration: none; }
    .back-link:hover { text-decoration: underline; }
    .code-container { max-width: 800px; margin: 0 auto 40px auto; text-align: left; background: #272822; border-radius: 6px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    .code-container h3 { background: #1e1e1e; margin: 0; padding: 10px 15px; font-size: 0.9rem; color: #888; border-bottom: 1px solid #333; }
    pre { margin: 0 !important; padding: 15px !important; font-size: 0.85rem; }
  </style>
</head>
<body>
  <a href="index.html" class="back-link">← 一覧に戻る</a>
  <h1>作者: 斉藤</h1>
  <p>マリオみたいなやつ</p>
  
  <script>https://editor.p5js.org/?version=2.3.3</script>

  <div class="code-container">
    <h3>ソースコード</h3>
    <pre><code class="language-javascript">https://editor.p5js.org/?version=2.3.3</code></pre>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-clike.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
</body>
</html>
